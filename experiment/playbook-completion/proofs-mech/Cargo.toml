[package]
name = "ivg-proofs-mech"
version = "0.1.0"
edition = "2021"
description = "Completion audit, PROOFS-MECH lane (proof debt D-14, playbook 3.3a item 2): the 13 shared mechanisms of semantics/MECHANISMS.md, each a trait with its state, operations and instance parameters, its L1 laws as spec predicates, generic lemmas proved once over the trait (the instance parameters' obligations are trait proof functions every instance discharges), and one instance per object variant; as-built variants that depart from a law are located controls with proved counterexamples."
publish = false

[dependencies]
vstd = { version = "=0.0.0-2026-09-20-0158", features = ["std", "alloc"] }
actors = { git = "file:///home/ziniu_wu_g5labs_ai/experiments/iris-vector-graph-playbook-uplift-20261113/playbook-reference-actors", rev = "c03f9fa9be961610f2b274ffbb6a2c88d7d4d877" }

[patch.crates-io]
verus_builtin_macros = { git = "file:///home/ziniu_wu_g5labs_ai/experiments/iris-vector-graph-playbook-uplift-20261113/playbook-reference-actors", rev = "c03f9fa9be961610f2b274ffbb6a2c88d7d4d877" }

[features]
# Located controls. Each feature compiles exactly one instance's discharge of the mechanism trait (impl <Mech>Object
# for <Variant>) in the mechanism's control file src/ctl_<mech>.rs; nothing else changes. The variant is either an
# as-built variant of the pin that mechanisms.json records as departing from a law (with its finding), or a generic
# mutant of the canonical instance (the semantics lane's negative control). Each must fail to verify only at the
# obligation(s) of the law(s) it breaks (the lines marked `// LOCATE <feature> <law>`), while its refutation of the
# obligation and its counterexample to the law (src/cxNN_<mech>.rs, always compiled) verify. Each control's metadata
# (explorer check ids, objects, findings, the explorer's violated laws, refutations, counterexamples) is its
# `// CONTROL` line in the ctl file; tools/run_proofs.py parses it and regenerates this list (--sync-features).
