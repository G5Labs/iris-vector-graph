[package]
name = "ivg-pa3-proofs"
version = "0.1.0"
edition = "2021"
description = "Completion audit, lane models-2, crate proofs-pa3 (proof debt D-13, playbook §3.3): the breadth crate (modules 11 ledger and 04 adjacency) with premise P-A3 removed: EraseGraph interleaves with writers of its own graph; reviewed guards (head lock, exclusive adjacency writer lock) and as-built controls F-1201 and F-C1202."
publish = false

[dependencies]
vstd = { version = "=0.0.0-2026-09-20-0158", features = ["std", "alloc"] }
actors = { git = "file:///home/ziniu_wu_g5labs_ai/experiments/iris-vector-graph-playbook-uplift-20261113/playbook-reference-actors", rev = "c03f9fa9be961610f2b274ffbb6a2c88d7d4d877" }

[patch.crates-io]
verus_builtin_macros = { git = "file:///home/ziniu_wu_g5labs_ai/experiments/iris-vector-graph-playbook-uplift-20261113/playbook-reference-actors", rev = "c03f9fa9be961610f2b274ffbb6a2c88d7d4d877" }

[features]
# Broken-implementation controls (playbook §3.3 gate). Each replaces one decision of the reviewed design by the pin's
# behaviour (as reproduced by the audit) and must make verification fail, every error located in the file named here.
# Module 11 (ledger):
control_f0801_ttl_cache = []              # src/ledger_l2.rs  the guard answers from a cached meta (TTL 5 s, guard.py:38-59)
control_f0801_fail_open = []              # src/ledger_l2.rs  a failed guard probe reads as never-enabled (guard.py:55-56)
control_f1108_unguarded_bulk_delete = []  # src/ledger_l2.rs  bulk_delete_adjacency has no guard (nodes_edges.py:2301-2339)
control_fc1101_stats_whole_row = []       # src/ledger_l2.rs  Bump saves the whole stats row from an unlocked copy (LedgerStats.cls:51-88)
# Module 04 (adjacency):
control_fc0401_write_before_gen = []      # src/adj_l2.rs     a writer changes out before its first generation step (Adjacency.cls:87-89, 151-156)
control_hd0401_erase_kills_gen = []       # src/adj_l2.rs     RemoveGraph kills out, then gen and degc (Adjacency.cls:434-439)
control_hd0401_rebuild_kills_gen = []     # src/adj_l2.rs     RemoveAll kills gen; FillEdge does not step it (Adjacency.cls:452-462, 824-830)
# Lane proofs-pa3 (D-13): premise P-A3 removed; each control puts back the pin's unguarded EraseGraph.
control_f1201_erase_no_head_lock = []     # src/ledger_l2.rs  EraseGraph takes no ledger head lock (Eraser.cls:47-261): a commit lands between its row DELETE and EraseLedgerFor
control_fc1202_erase_unguarded = []       # src/adj_l2.rs     EraseGraph takes no lock before its DELETE; RemoveGraph's ^IVG.AdjW(g)#"S" excludes no writer (Adjacency.cls:428-445)

[package.metadata.verus]
verify = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_only)', 'cfg(verus_keep_ghost)', 'cfg(verus_keep_ghost_body)'] }

[workspace]
